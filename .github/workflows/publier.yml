# Génère la boutique au format v2 de ZimaOS (store.json, index.json, apps/)
# à partir de Apps/, puis la publie sur GitHub Pages.
name: Publier la boutique

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Générer la boutique
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://huuberrt.github.io/zimaos-boutique

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploiement
        uses: actions/deploy-pages@v4
