# Application jetable de l'essai (chantier 24 de nas-zimaos) : vérifier que
# ZimaOS détecte et applique une mise à jour proposée par cette boutique.
name: hb-whoami
services:
  hb-whoami:
    container_name: hb-whoami
    image: traefik/whoami:v1.12.0
    ports:
      - target: 80
        published: "8301"
        protocol: tcp
    restart: unless-stopped
x-casaos:
  architectures:
    - amd64
  main: hb-whoami
  author: Hubert
  developer: traefik
  category: Hubert
  description:
    en_us: Page de test qui affiche les informations de la requête.
  tagline:
    en_us: Application d'essai de la boutique.
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/OpenSpeedTest/icon.png
  index: /
  port_map: "8301"
  scheme: http
  store_app_id: hb-whoami
  title:
    en_us: Whoami (essai)
